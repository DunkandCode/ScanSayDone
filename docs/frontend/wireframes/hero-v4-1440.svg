  <text x="1280" y="300" font-size="10" fill="#5A5555">la demo del landing</text>
  <text x="1280" y="314" font-size="10" fill="#5A5555">preilumina el 9</text>
  <text x="1280" y="328" font-size="10" fill="#5A5555">(survey-card.tsx:102);</text>
  <text x="1280" y="342" font-size="10" fill="#5A5555">la encuesta real no</text>
  <text x="1280" y="356" font-size="10" fill="#5A5555">preselecciona</text>

  <!-- anotaciones -->
  <text x="96" y="600" font-size="10" fill="#5A5555">flex col→fila SOLO ≥1200 (xl:flex-row) · texto max-w-xl 576 · tarjeta max-w-sm 384 · py-16 lg:py-20 · min-h 616 (lg:min-h-marketing-hero)</text>
  <text x="96" y="616" font-size="10" fill="#5A5555">H1 Bebas clamp(40, 5vw, 72) lh 0.98 · línea de acento en chip ink (hero.tsx:18-19) · eyebrow 14 · sub 18 (tamaños reales mayores a los dibujados)</text>
