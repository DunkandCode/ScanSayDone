<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Montserrat, 'Segoe UI', Arial, sans-serif">
  <title>Hero v4 — landing 1440</title>
  <desc>Wireframe del hero v4 servido: escena fullbleed con halo radial, bloque de texto a la izquierda (max 576), tarjeta demo de encuesta a la derecha (max 384) con rejilla 0-10 y tag DEMO. Sustituye la imagen de plano desactualizada.</desc>

  <!-- Franja de encabezado de hoja -->
  <rect x="0" y="0" width="1440" height="36" fill="#F0D8BD"/>
  <line x1="0" y1="36" x2="1440" y2="36" stroke="#D9C0A0" stroke-width="1"/>
  <text x="16" y="23" font-size="11" font-weight="700" letter-spacing="0.5" fill="#1A181B">HERO V4 — LANDING · 1440 · FILA TEXTO|TARJETA SOLO ≥1200</text>
  <text x="1424" y="23" font-size="10" fill="#5A5555" text-anchor="end">BORRADOR 2026-11-12 · wireframe 1:1 px</text>

  <!-- escena fullbleed -->
  <rect x="0" y="36" width="1440" height="828" fill="#F7E5C8"/>
  <!-- halo radial (maqueta: círculos concéntricos) -->
  <circle cx="1064" cy="400" r="320" fill="#F0D8BD" fill-opacity="0.22"/>
  <circle cx="1064" cy="400" r="230" fill="#F0D8BD" fill-opacity="0.30"/>
  <circle cx="1064" cy="400" r="145" fill="#F0D8BD" fill-opacity="0.38"/>
  <text x="1064" y="118" font-size="10" fill="#5A5555" text-anchor="middle">halo radial (hero.tsx:37-46) · maqueta: círculos concéntricos</text>
  <text x="720" y="806" font-size="10" fill="#5A5555" text-anchor="middle">escena panorámica fullbleed SOLO ≥992 (hero.tsx:10-25) — imagen real declarada en producto; aquí zona de wireframe</text>

  <!-- bloque de texto izq. max-w-xl 576 -->
  <line x1="96" y1="186" x2="96" y2="191" stroke="#5A5555" stroke-width="1"/>
  <line x1="672" y1="186" x2="672" y2="191" stroke="#5A5555" stroke-width="1"/>
  <line x1="96" y1="188" x2="672" y2="188" stroke="#5A5555" stroke-width="1"/>
  <text x="384" y="184" font-size="10" fill="#5A5555" text-anchor="middle">max-w-xl 576</text>
  <text x="96" y="216" font-size="11" font-weight="600" letter-spacing="1" fill="#5A5555">ENCUESTAS DE SATISFACCIÓN PARA RESTAURANTES Y COMERCIOS</text>
  <text x="96" y="268" font-size="52" font-family="'Bebas Neue', 'Arial Narrow', Arial, sans-serif" fill="#1A181B">LO QUE TUS CLIENTES</text>
  <rect x="96" y="288" width="210" height="50" fill="#1A181B"/>
  <text x="106" y="326" font-size="52" font-family="'Bebas Neue', 'Arial Narrow', Arial, sans-serif" fill="#F7E5C8">PIENSAN,</text>
  <text x="96" y="398" font-size="52" font-family="'Bebas Neue', 'Arial Narrow', Arial, sans-serif" fill="#1A181B">ANTES DE QUE SE VAYAN</text>
  <text x="96" y="436" font-size="13" fill="#5A5555">Un código en la mesa. Una respuesta breve. Un panel con lo que necesitas saber.</text>
  <rect x="96" y="464" width="280" height="48" rx="4" fill="#1A181B"/>
  <text x="236" y="493" font-size="12" font-weight="600" fill="#F7E5C8" text-anchor="middle">Ver una encuesta de ejemplo</text>
  <text x="96" y="534" font-size="10" fill="#5A5555">CTA → ancla interna #encuesta-demo (no ruta) · relleno ink #1A181B (el coral del [prop] no está servido)</text>

