  <line x1="0" y1="852" x2="1440" y2="852" stroke="#D9C0A0" stroke-width="1"/>
  <text x="16" y="868" font-size="10" fill="#5A5555">Tokens: página #F7E5C8 · superficie #FFFFFF · elevado #F0D8BD (halo/tag) · tinta #1A181B · secundario #5A5555 · coral #FC5A41 (ficha 9, número tinta) · borde tarjeta 2 px #8A6F55 — sin sombras; borde 1 px</text>
