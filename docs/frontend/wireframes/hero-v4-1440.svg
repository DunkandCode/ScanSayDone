  <rect x="1074.1" y="344" width="48.7" height="48" rx="2" fill="#FC5A41" stroke="#1A181B" stroke-width="2"/>
  <text x="1098.45" y="373" font-size="11" font-weight="600" fill="#1A181B" text-anchor="middle">9</text>
  <rect x="1130.8" y="344" width="48.7" height="48" rx="2" fill="#FFFFFF" stroke="#8A6F55" stroke-width="1.2"/>
