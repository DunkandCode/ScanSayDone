  <text x="16" y="868" font-size="10" fill="#5A5555">Tokens: fondo #F7E5C8 → #F0D8BD (dos bandas, G6) · superficie #FFFFFF borde 1 px #8A6F55 · elevado #F0D8BD (chip) · tinta #1A181B · secundario #5A5555 — sin sombras; borde 1 px</text>
  <text x="16" y="884" font-size="10" fill="#5A5555">inputs 48 / botón 52 / «Ver» 44×44 — táctil ≥44 ✓ · foco 3 px interior #1A181B · a 375 la tarjeta llena 343 · sustituye cota 400 → 430</text>
